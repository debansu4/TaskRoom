<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskRoom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                <span>Task</span>Room
            </div>

            <button id="themeBtn" class="icon-btn">
                🌙
            </button>

        </header>


        <!-- MAIN -->
        <main>

            <section class="welcome">

                <p class="eyebrow">
                    PERSONAL TASKS
                </p>

                <h1>My To-Do List</h1>

                <p class="subtitle">
                    Organize your tasks and get things done.
                </p>

            </section>


            <!-- ADD TASK -->
            <section class="add-task">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    + Add Task
                </button>

            </section>


            <!-- TASK HEADER -->
            <div class="task-header">

                <span id="taskCount">
                    0 tasks
                </span>

                <div class="filters">

                    <button
                        class="filter active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="filter"
                        data-filter="active"
                    >
                        Active
                    </button>

                    <button
                        class="filter"
                        data-filter="completed"
                    >
                        Completed
                    </button>

                </div>

            </div>


            <!-- TASK LIST -->
            <section id="taskList" class="task-list"></section>

        </main>


        <!-- LOGIN BOX -->
        <section class="login-box">

            <div>

                <strong>TaskRoom Account</strong>

                <p id="loginStatus">
                    Login to sync your tasks and collaborate.
                </p>

            </div>

            <button
                id="loginBtn"
                class="login-btn"
            >
                Login / Sign Up
            </button>

        </section>

    </div>


    <!-- AUTH MODAL -->
    <div
        id="authModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <button
                id="closeAuth"
                class="close-btn"
                type="button"
            >
                ×
            </button>


            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h2 id="authTitle">
                    Welcome Back
                </h2>

                <p id="authSubtitle">
                    Login to your TaskRoom account
                </p>

            </div>


            <form id="authForm">

                <label for="emailInput">
                    Email
                </label>

                <input
                    id="emailInput"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >


                <label for="passwordInput">
                    Password
                </label>

                <input
                    id="passwordInput"
                    type="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="authSubmit"
                    class="auth-submit"
                >
                    Login
                </button>

            </form>


            <p
                id="authMessage"
                class="auth-message"
            ></p>


            <button
                id="switchAuth"
                class="switch-btn"
                type="button"
            >
                Don't have an account? Sign Up
            </button>

        </div>

    </div>


    <script
        type="module"
        src="app.js"
    ></script>

</body>
</html>
